name: Gammill Daily Summary

on:
  schedule:
    # 03:07 UTC = ~10:07 PM Central (adjusts with DST). Deliberately an odd,
    # non-round minute - scheduling at :00 (or other common minutes like :15/
    # :30) puts this in GitHub's busier queue slots, which can delay or
    # occasionally skip runs. An off-beat minute like :07 avoids most of that.
    - cron: "7 3 * * *"
  workflow_dispatch:
    # Lets you manually trigger a run from the Actions tab, e.g. to test.

permissions:
  contents: write

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily summary
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python daily_summary.py

      - name: Save reset daily-summary state
        run: |
          git config user.name "gammill-watcher-bot"
          git config user.email "actions@github.com"
          git add daily_summary.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Reset daily summary"
          git push
