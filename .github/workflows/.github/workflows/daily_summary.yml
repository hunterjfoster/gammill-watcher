name: Gammill Daily Summary

on:
  schedule:
    # 03:00 UTC = 10:00 PM Central Daylight Time (summer) / 9:00 PM Central
    # Standard Time (winter). GitHub cron doesn't handle DST, so this will
    # drift by an hour depending on time of year - adjust the number below
    # if you want it pinned to an exact local time year-round.
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Lets you manually trigger a run from the Actions tab, e.g. to test.

permissions:
  contents: write

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily summary
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python daily_summary.py

      - name: Save reset daily-summary state
        run: |
          git config user.name "gammill-watcher-bot"
          git config user.email "actions@github.com"
          git add daily_summary.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Reset daily summary"
          git push
