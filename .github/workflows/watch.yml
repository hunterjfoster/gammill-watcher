name: Gammill Watcher

on:
  schedule:
    # Runs every 5 minutes so you're notified as close to real-time as
    # possible. GitHub's schedule times can occasionally run a few minutes
    # late during high platform load - that's normal and not something to
    # worry about.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # Lets you manually trigger a run from the Actions tab, e.g. to test.

# Needed so the workflow can commit the updated seen_listings.json back to the repo
permissions:
  contents: write

jobs:
  check-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python watch_gammill.py

      - name: Save updated seen-listings state
        run: |
          git config user.name "gammill-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_listings.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen listings"
          git push
